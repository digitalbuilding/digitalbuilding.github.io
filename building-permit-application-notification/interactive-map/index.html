<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Baueingabe</title>
    <style type="text/css">
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; }
        .viewer { max-width: 1140px; margin: auto; padding: 24px; }
        #map_container { border: 1px solid #212529; padding: 8px; }
        #map_status span { display: block; }
        [hidden] { display: none !important; }
        #map {
            height: 600px;
            width: 100%;
        }
    </style>
    <script>
        let searchParams = null;
        let locations = null;
        let mapFailed = false;

        const errorMessages = {
            coordinates: {
                de: 'Die Kartenkoordinaten fehlen oder sind ungültig.',
                fr: 'Les coordonnées de la carte sont manquantes ou invalides.',
                it: 'Le coordinate della mappa sono mancanti o non valide.'
            },
            key: {
                de: 'Der Kartenschlüssel fehlt.',
                fr: 'La clé d’accès à la carte est manquante.',
                it: 'Manca la chiave di accesso alla mappa.'
            },
            loading: {
                de: 'Die Karte konnte nicht geladen werden.',
                fr: 'Impossible de charger la carte.',
                it: 'Impossibile caricare la mappa.'
            },
            authorization: {
                de: 'Die Karte konnte nicht autorisiert werden.',
                fr: 'Impossible d’autoriser la carte.',
                it: 'Impossibile autorizzare la mappa.'
            }
        };

        function showError(reason) {
            mapFailed = true;
            document.getElementById('map_container').hidden = true;
            const status = document.getElementById('map_status');
            status.replaceChildren(...Object.entries(errorMessages[reason]).map(([language, text]) => {
                const line = document.createElement('span');
                line.lang = language;
                line.textContent = text;
                return line;
            }));
            status.hidden = false;
        }

        function readCoordinate(name, limit) {
            const value = searchParams.get(name);
            if (value === null || value.trim() === '') {
                return null;
            }
            const coordinate = Number(value);
            return Number.isFinite(coordinate) && Math.abs(coordinate) <= limit ? coordinate : null;
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Base64-encoded URLSearchParams:
            // postBuildingLatitude=...&postBuildingLongitude=...&postBuildingLabel=...
            // &permitApplicationLatitude=...&permitApplicationLongitude=...&permitApplicationLabel=...
            // &googleMapsApiKey=<referrer-restricted key>

            try {
                let q = window.location.search.substring(1)
                q = atob(q)
                searchParams = new URLSearchParams(q);
            }
            catch (err) {
                searchParams = new URLSearchParams(window.location.search);
            }

            const postBuildingLatitude = readCoordinate('postBuildingLatitude', 90);
            const postBuildingLongitude = readCoordinate('postBuildingLongitude', 180);
            const permitApplicationLatitude = readCoordinate('permitApplicationLatitude', 90);
            const permitApplicationLongitude = readCoordinate('permitApplicationLongitude', 180);
            if ([postBuildingLatitude, postBuildingLongitude, permitApplicationLatitude, permitApplicationLongitude]
                .some(value => value === null)) {
                showError('coordinates');
                return;
            }
            locations = {
                postBuilding: { lat: postBuildingLatitude, lng: postBuildingLongitude },
                permitApplication: { lat: permitApplicationLatitude, lng: permitApplicationLongitude }
            };

            const key = searchParams.get('googleMapsApiKey');
            if (!key) {
                showError('key');
                return;
            }
            const script = document.createElement('script');
            script.async = true;
            script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&loading=async&callback=initMap&v=weekly`;
            script.onerror = () => showError('loading');
            document.body.appendChild(script);
            setTimeout(() => {
                if (!document.getElementById('map_status').hidden && !mapFailed) {
                    showError('loading');
                }
            }, 15000);
        });

        function gm_authFailure() {
            showError('authorization');
        }

        // Initialize and add the map
        async function initMap() {
            if (mapFailed) {
                return;
            }
            const postBuildingLocation = locations.postBuilding;
            const permitApplicationLocation = locations.permitApplication;
            const mapCenter = {
                lat: (postBuildingLocation.lat + permitApplicationLocation.lat) / 2,
                lng: (postBuildingLocation.lng + permitApplicationLocation.lng) / 2
            };
            const locationsAreDistinct = postBuildingLocation.lat !== permitApplicationLocation.lat
                || postBuildingLocation.lng !== permitApplicationLocation.lng;

            const postBuildingLabel = searchParams.get('postBuildingLabel') || "";
            const permitApplicationLabel = searchParams.get('permitApplicationLabel') || "";

            try {
                const { AdvancedMarkerElement } = await google.maps.importLibrary('marker');
                if (mapFailed) {
                    return;
                }
                document.getElementById('map_container').hidden = false;
                const map = new google.maps.Map(document.getElementById('map'), {
                    zoom: 17,
                    center: mapCenter,
                    mapId: 'fdae4a2e75dc1ea557d59a96'
                });
                google.maps.event.addListenerOnce(map, 'idle', () => {
                    if (map.getZoom() > 17) {
                        map.setZoom(17);
                    }
                    if (!mapFailed) {
                        document.getElementById('map_status').hidden = true;
                    }
                });
                if (locationsAreDistinct) {
                    const bounds = new google.maps.LatLngBounds();
                    bounds.extend(postBuildingLocation);
                    bounds.extend(permitApplicationLocation);
                    map.fitBounds(bounds, 48);
                }

                const postBuildingIcon = document.querySelector('#markerStd svg');
                postBuildingIcon.setAttribute('width', '28');
                postBuildingIcon.setAttribute('height', '28');
                postBuildingIcon.style.display = 'block';
                const postBuildingMarker = new AdvancedMarkerElement({
                    position: postBuildingLocation,
                    map,
                    title: postBuildingLabel,
                    anchorLeft: '-50%',
                    anchorTop: '-50%'
                });
                postBuildingMarker.append(postBuildingIcon);

                const permitApplicationIcon = document.querySelector('#markerPylon svg');
                permitApplicationIcon.setAttribute('width', '32');
                permitApplicationIcon.setAttribute('height', '32');
                permitApplicationIcon.style.display = 'block';
                const permitApplicationMarker = new AdvancedMarkerElement({
                    position: permitApplicationLocation,
                    map,
                    title: permitApplicationLabel,
                    anchorLeft: '-50%',
                    anchorTop: '-75%'
                });
                permitApplicationMarker.append(permitApplicationIcon);
            } catch (error) {
                showError('loading');
            }
        }
    </script>
